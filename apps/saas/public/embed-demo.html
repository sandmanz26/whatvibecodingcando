<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo site · collaboration script</title>
  <style>
    /* A plain website with its own, deliberately aggressive CSS: the widget must not be affected by it. */
    * { box-sizing: border-box; }
    button { all: unset; background: #111; color: #fff; padding: 10px 18px; border-radius: 4px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    body { margin: 0; font: 17px/1.6 Georgia, serif; color: #222; background: #fbfaf7; }
    header { display: flex; gap: 24px; align-items: center; padding: 18px 32px; border-bottom: 1px solid #e5e2da; }
    header nav a { color: #222; margin-right: 16px; }
    main { max-width: 960px; margin: 0 auto; padding: 48px 32px 160px; }
    .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center; }
    .art { aspect-ratio: 4 / 3; background: repeating-linear-gradient(45deg, #ece8de, #ece8de 10px, #f4f1ea 10px, #f4f1ea 20px); border-radius: 12px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 48px; }
    .card { background: #fff; border: 1px solid #e5e2da; border-radius: 10px; padding: 18px; }
    form { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 8px; }
    input { flex: 1 1 200px; min-width: 0; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
    .note { margin-top: 40px; padding: 14px 16px; background: #fff7e6; border: 1px solid #f3d9a4; border-radius: 8px; font: 14px/1.5 system-ui, sans-serif; }
    @media (max-width: 720px) { .hero, .cards { grid-template-columns: 1fr; } header { flex-wrap: wrap; } }
    /* ?look=wire: a lo-fi wireframe (grey blocks, no copy), used by the panel's draft preview so the widget stands out. */
    html.wire body { background: #f4f4f2; font: 14px/1.4 system-ui, sans-serif; color: #9a9a96; }
    html.wire header { background: #fff; border-color: #e3e3df; }
    .wire .bar { display: block; height: 12px; border-radius: 6px; background: #dcdcd8; }
    .wire .bar.h1 { height: 28px; width: 80%; background: #c9c9c4; margin-bottom: 10px; }
    .wire .bar.h1.short { width: 55%; }
    .wire .bar.h3 { height: 14px; width: 45%; background: #c9c9c4; margin-bottom: 12px; }
    .wire .lines { display: grid; gap: 8px; margin: 18px 0 22px; }
    .wire .lines .bar:last-child { width: 70%; }
    .wire .btn { display: inline-block; width: 140px; height: 40px; border-radius: 8px; background: #bdbdb8; }
    .wire .art { background: #e3e3df; border: 2px dashed #cfcfca; }
    .wire .card { border-color: #e3e3df; min-height: 120px; }
    .wire .logo { width: 90px; height: 18px; border-radius: 5px; background: #c9c9c4; }
    .wire .pill { width: 54px; height: 10px; border-radius: 5px; background: #dcdcd8; display: inline-block; margin-right: 14px; }
    .wire .field { flex: 1 1 200px; height: 40px; border-radius: 8px; background: #fff; border: 1.5px solid #dcdcd8; }
  </style>
</head>
<body>
  <header>
    <strong>Demo Site</strong>
    <nav><a href="#/">Home</a><a href="#/pricing">Pricing</a></nav>
  </header>
  <main id="app"></main>

  <script>
    // A tiny hash router, so the demo also has "pages" without reloading.
    const pages = {
      '/': `
        <section class="hero">
          <div>
            <h1 id="headline">A plain website, not built with this app</h1>
            <p>This page has its own HTML, CSS and JavaScript. One script tag at the bottom adds comments, replies and completion to it. Press <b>Comment</b> (or C) and click anything.</p>
            <button id="cta">Start free trial</button>
          </div>
          <div class="art" role="img" aria-label="Illustration"></div>
        </section>
        <section class="cards">
          <div class="card" id="card-fast"><h3>Fast</h3><p>Pins stick to the element they were dropped on, even when the layout changes.</p></div>
          <div class="card" id="card-shared"><h3>Shared</h3><p>Replies and a completed state keep feedback moving.</p></div>
          <div class="card" id="card-safe"><h3>Isolated</h3><p>The widget lives in a shadow root, so this page’s CSS can’t break it.</p></div>
        </section>
        <form onsubmit="event.preventDefault()">
          <input placeholder="Type here: the C key doesn't start a comment while you type" aria-label="Email" />
          <button type="submit">Subscribe</button>
        </form>
        <p class="note"><span id="where">Comments on this demo are saved in your browser only.</span> Project: <b id="proj"></b></p>`,
      '/pricing': `
        <h1>Pricing</h1>
        <section class="cards">
          <div class="card" id="plan-free"><h3>Free</h3><p>For trying it out.</p></div>
          <div class="card" id="plan-team"><h3>Team</h3><p>For a product team.</p></div>
          <div class="card" id="plan-org"><h3>Organisation</h3><p>For many teams.</p></div>
        </section>`,
    }
    // The wireframe look: the same layout as grey blocks.
    const wire = new URLSearchParams(location.search).get('look') === 'wire'
    if (wire) {
      document.documentElement.classList.add('wire')
      document.querySelector('header').innerHTML = '<span class="logo" aria-label="Logo"></span><nav><a href="#/" class="pill" aria-label="Home"></a><a href="#/pricing" class="pill" aria-label="Pricing"></a></nav>'
      const lines = (n) => `<div class="lines">${'<span class="bar"></span>'.repeat(n)}</div>`
      const card = (id) => `<div class="card" id="${id}"><span class="bar h3"></span>${lines(3)}</div>`
      pages['/'] = `
        <section class="hero">
          <div><span class="bar h1" id="headline"></span><span class="bar h1 short"></span>${lines(3)}<span class="btn" id="cta" role="button" aria-label="Main button"></span></div>
          <div class="art" role="img" aria-label="Image"></div>
        </section>
        <section class="cards">${card('card-fast')}${card('card-shared')}${card('card-safe')}</section>
        <form onsubmit="event.preventDefault()"><span class="field"></span><span class="btn"></span></form>`
      pages['/pricing'] = `<span class="bar h1 short"></span><section class="cards">${card('plan-free')}${card('plan-team')}${card('plan-org')}</section>`
    }
    const render = () => { const r = location.hash.slice(1) || '/'; document.getElementById('app').innerHTML = pages[r] || pages['/'] }
    addEventListener('hashchange', render)
    render()
    const showProject = () => {
      const v = window.__vibeCollab, el = document.getElementById('proj'), w = document.getElementById('where')
      if (el) el.textContent = (v && v.project) || '…'
      if (w && v && v.server) w.textContent = 'Comments on this demo are saved on the project’s server; only reviewers with a review link see the widget.'
    }
    addEventListener('load', () => { showProject(); setTimeout(showProject, 1500); setTimeout(showProject, 4000) }); addEventListener('hashchange', () => setTimeout(showProject))
  </script>

  <!-- The whole installation: -->
  <script src="./embed/vibe.js" data-project="embed-demo" defer></script>
  <script>
    // Opened from the user panel as embed-demo.html?project=<id>: comments made here belong to that project.
    // (A real site has just the one tag above, with its own project id.)
    const want = new URLSearchParams(location.search).get('project')
    if (want && /^[\w-]{1,64}$/.test(want)) document.querySelector('script[src="./embed/vibe.js"]').dataset.project = want
  </script>
</body>
</html>
