      {"@context":"https://schema.org","@type":"SoftwareApplication","name":"Vibe Collab","url":"__SITE__/","applicationCategory":"DeveloperApplication","operatingSystem":"Web","description":"One script tag adds pinned comments, voice notes and user tests (usability tasks, 5-second tests, click heatmaps) to any website. Clients review with a link, no account.","offers":[{"@type":"Offer","name":"Free","price":"0","priceCurrency":"USD"},{"@type":"Offer","name":"Pro, per site per month","price":"2","priceCurrency":"USD"}]}

    <script>
      // The site's root used to be the app: its links (#/app/…, #/share/…, #/guide) and sign-in
      // returns from emails (?code=…, ?token_hash=…) carry on to the app at /app.
      (function () {
        function go() {
          var h = location.hash, s = location.search
          if (/^#\//.test(h) || /[?&](auth|code|token_hash|error|error_description)=/.test(s)) location.replace('/app' + s + h)
        }
        go()
        addEventListener('hashchange', go)
      })()
    </script>
